name: CI/CD

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── C Engine (legacy — non-blocking) ─────────────────────────────────────
  c-engine:
    name: C Engine (Linux / Clang)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libssl-dev zlib1g-dev valgrind

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_C_COMPILER=clang -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build native/build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir native/build --output-on-failure

      - name: Valgrind (memory check on encryption tests)
        run: valgrind --error-exitcode=1 --leak-check=full native/build/se_tests --gtest_filter=Encryption.*

  # ── Flutter ──────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test
        run: flutter test --coverage
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
        continue-on-error: true

  # ── Android Build ─────────────────────────────────────────────────────────
  android-build:
    name: Android AAB (release, obfuscated)
    needs: [flutter-analyze]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Bootstrap Gradle wrapper jar
        run: |
          curl -sL \
            https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar \
            -o android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release AAB (obfuscated)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-aab-${{ github.run_number }}
          path: build/symbols/
          retention-days: 90

  # ── iOS Build ─────────────────────────────────────────────────────────────
  ios-build:
    name: iOS IPA
    needs: [flutter-analyze]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

  # ── Backend (non-blocking — directory not yet present) ────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-22.04
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       ai_security_test
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check backend exists
        run: test -d backend || (echo "backend/ not yet present, skipping" && exit 0)

      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/ai_security_test
          JWT_SECRET:   test-secret-ci

  # ── Publish (internal track) ───────────────────────────────────────────
  publish-android:
    name: Publish to Play (internal)
    needs: android-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName:                 com.sinnov8.aisecurity
          releaseFiles:                '*.aab'
          track:                       internal
