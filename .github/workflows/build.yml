name: Build Debug APK

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      # Generate gradle-wrapper.jar by running `gradle wrapper` with the official Gradle 8.6 binary.
      # Downloading the raw JAR from GitHub fails because the file is stored in Git LFS —
      # the raw endpoint returns the LFS pointer text, not the actual binary.
      - name: Bootstrap Gradle wrapper jar
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip \
            -o /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /tmp/gradle-home
          /tmp/gradle-home/gradle-8.6/bin/gradle \
            -p android wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x android/gradlew

      - name: Flutter doctor
        run: flutter doctor -v
        continue-on-error: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK (obfuscated)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.run_number }}
          path: build/symbols/
          retention-days: 90
