name: Build Release APK

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  release-apk:
    name: Release APK (obfuscated)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # local.properties must exist before Gradle evaluates settings.gradle.
      # Flutter normally writes it during `flutter build`, but we need it earlier
      # so the `gradle wrapper` bootstrap can evaluate settings.gradle successfully.
      - name: Create local.properties + bootstrap gradle-wrapper.jar
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_SDK_ROOT" "$FLUTTER_ROOT" \
            > android/local.properties

          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip \
            -o /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /tmp/gradle-home
          /tmp/gradle-home/gradle-8.6/bin/gradle \
            -p android wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x android/gradlew

      - name: Generate code (freezed / riverpod / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK (obfuscated)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.run_number }}
          path: build/symbols/
          retention-days: 90
