name: ai_phone_security
description: Anti-Scam & Elderly Safety Platform for India
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # ML inference
  onnxruntime: ^1.4.0

  # Notifications — v19 targets Dart 3.4 / Flutter 3.22 explicitly
  flutter_local_notifications: ^19.0.0

  # Navigation
  go_router: ^14.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Sensors (fall detection)
  sensors_plus: ^5.0.1

  # Code-gen annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.3
  http: ^1.2.2
  logger: ^2.4.0
  intl: ^0.19.0
  crypto: ^3.0.3
  ffi: ^2.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/data/
